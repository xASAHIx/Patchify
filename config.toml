strict-sigcheck = true

[YouTube-ReVanced-Extended]
enabled = true
brand = "ReVanced-Extended"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
changelog-keywords = ["YouTube"]
arch = "arm64-v8a"
version = "21.39.525"
patcher-args = "-e 'Custom Shorts action buttons' -OiconType='round' -e 'Overlay buttons' -OiconType='rounded' -ObottomMargin='0.1dip' -e 'Settings for YouTube' -OrvxSettingsLabel='Settings' -e 'Snack bar components' -OcornerRadius='100.0dip' -OapplyCornerRadiusToPlaylistBottomBar=true -OdarkThemeBackgroundColor='@android:color/black' -OlightThemeBackgroundColor='@android:color/white' -OstrokeColor='?attr/ytChipBackground' -e 'Visual preferences icons for YouTube' -OsettingsMenuIcon='rvx_letters_bold'"

[YouTube-ReVanced-Extended.patches]
"github:anddea/revanced-patches" = { version = "dev", include = ["Hide Shorts dimming"], exclude = ["Enable debug logging", "Translations for YouTube"] }

[YouTube-Music-ReVanced-Extended]
enabled = true
brand = "ReVanced-Extended"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
changelog-keywords = ["YouTube Music"]
arch = "arm64-v8a"
version = "9.40.51"
patcher-args = "-e 'Settings for YouTube Music' -OrvxSettingsLabel='Settings' -e 'Visual preferences icons for YouTube Music' -OsettingsMenuIcon='rvx_letters_bold'"

[YouTube-Music-ReVanced-Extended.patches]
"github:anddea/revanced-patches" = { version = "dev", include = ["Disable music video in album"], exclude = ["Enable debug logging", "Translations for YouTube Music"] }

[YouTube]
enabled = true
brand = "Morphe"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
arch = "arm64-v8a"
version = "exp"
patcher-args = "-e 'Custom branding' -OcustomName='YouTube' -OappIcon='original'"

[YouTube.patches]
"github:MorpheApp/morphe-patches" = { version = "latest", exclude = ["Disable play store updates"] }

[YouTube-Music]
enabled = true
brand = "Morphe"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
arch = "arm64-v8a"
version = "exp"
patcher-args = "-e 'Custom branding' -OcustomName='YouTube Music' -OappIcon='original'"

[YouTube-Music.patches]
"github:MorpheApp/morphe-patches" = { version = "latest", exclude = ["Disable play store updates"] }

[Reddit]
enabled = true
brand = "Morphe"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
version = "2026.42.0"
changelog-keywords = ["Reddit"]
patcher-args = "-e 'Colorize comment indent lines' -OindentLineColors1='#0066FF' -OindentLineColors2='#FF2E88' -OindentLineColors3='#9B5CFF' -OindentLineColors4='#2DE2E6' -OindentLineColors5='#FF5FA2' -OindentLineColors6='#FF8A3D' -OindentLineColors7='#FFD166' -OindentLineColors8='#3CFF7F' -OisCurrentLevelOnly=true"

[Reddit.patches]
"github:MorpheApp/morphe-patches" = { version = "latest" }
"github:jkennethcarino/adobo" = { version = "dev", include = ["Disable home feed auto-refresh", "Disable post detail swipe"], exclude = ["Hide post view counts", "Disable screenshot banner", "Open external links directly", "Sanitize share links"] }

[Twitter]
enabled = true
brand = "Piko"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter"
changelog-keywords = ["Twitter"]
arch = "arm64-v8a"

[Twitter.patches]
"github:crimera/piko" = { version = "dev", include = ["Browse tweet object", "Bring back twitter"] }

[X]
enabled = true
brand = "Piko"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter"
version = "auto"
arch = "arm64-v8a"
patcher-args = "-e 'Clone' -OappName='X'"

[X.patches]
"github:crimera/piko-newx" = []

[Instagram]
enabled = true
brand = "Piko"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
changelog-keywords = ["Instagram"]
arch = "arm64-v8a"
patcher-args = "-e 'Clone' -OpackageName='com.instagram' -OappName='Instagram'"

[Instagram.patches]
"github:crimera/piko" = { version = "dev", include = ["Disable analytics", "Disable screenshot detection", "Make ephemeral media permanent", "View DMs anonymously", "View live anonymously", "View stories anonymously"], exclude = ["Change version code"] }

[Instagram-Hush]
enabled = true
brand = "Hush"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
arch = "arm64-v8a"
patcher-args = "-e 'Install next to Instagram' -OappName='HushGram' -OmarkIcon=true"

[Instagram-Hush.patches]
"github:SysAdminDoc/HushGram" = { version = "latest", include = ["Pure black dark mode", "Open developer options", "View DM photos and videos anonymously"] }

[Gboard]
enabled = true
brand = "Gboard"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/gboard/"
arch = "arm64-v8a"
changelog-keyword = ["Gboard"]
patcher-args = "-e 'Package Rename' -Oapp_display_name='KEYBOARD'"

[Gboard.patches]
"github:jasonwu1994/Gboard-patches" = { version = "dev" }
"github:hoo-dles/morphe-patches" = { version = "latest", include = ["Hide app icon"] }

[Pinterest]
enabled = true
brand = "Hush"
apkmirror-dlurl = "https://www.apkmirror.com/apk/pinterest/pinterest-one-destination-for-a-world-of-inspiration/"
arch = "arm64-v8a"

[Pinterest.patches]
"github:SysAdminDoc/HushPinterest" = []
"github:MorpheApp/morphe-patches" = []

[Google-Photos]
enabled = true
brand = "Photos"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos/"
version = "auto"
arch = "arm64-v8a"

[Google-Photos.patches]
"github:Akash-Sriram/morphe-google-photos" = { version = "latest", include = ["Custom Morphe branding"] }
